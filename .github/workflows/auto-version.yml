name: ClickCap Auto Version

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'manifest.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test -- --runInBand
      - run: node scripts/bump-version.mjs patch
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json
          git diff --cached --quiet || git commit -m "Advance ClickCap extension version [skip version]"
          git push
